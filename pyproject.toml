[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hushdiff"
version = "0.1.0"
description = "Mask secret-shaped tokens in git diffs so patches are safer to paste into LLM/agent chats."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rashed Hasan" }]
keywords = ["git", "diff", "secrets", "redaction", "llm", "agents", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
hushdiff = "hushdiff.cli:main"

[project.urls]
Homepage = "https://github.com/rashedhasan090/hushdiff"
Repository = "https://github.com/rashedhasan090/hushdiff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
